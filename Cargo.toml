[package]
name = "go-updater"
version = "0.1.0"
edition = "2024"
description = "Simple CLI to check and update Go (Golang) installations on Linux."
license = "MIT"
readme = "README.md"
repository = "https://github.com/christiandoxa/go-updater"
homepage = "https://github.com/christiandoxa/go-updater"
keywords = ["go", "golang", "updater", "cli", "linux"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11.0-rc.2"
hex = "0.4"
regex = "1.10"
libc = "1.0.0-alpha.1"
serde_json = "1.0.145"
tempfile = "3.23.0"

[dev-dependencies]
tempfile = "3.23"
httpmock = "0.8"
assert_cmd = "2.0"

[[bin]]
name = "go-updater"
path = "src/main.rs"
