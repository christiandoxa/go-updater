name: Coverage
on: [ push, pull_request ]
jobs:
  llvm-cov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      # Install cargo-llvm-cov
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      # Bersihkan & jalankan coverage untuk lib + bins + integration tests
      - name: Run coverage (fail if <95%)
        env:
          RUST_TEST_THREADS: "1"        # serial di dalam tiap test binary
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --all-features -j 1 \
            --lcov --fail-under-lines 95 \
            --ignore-filename-regex '(.*/tests/.*|.*/.cargo/.*)' \
            -- --test-threads=1

      # (Opsional) upload laporan HTML agar bisa dilihat di Actions artifact
      - name: Generate HTML report
        run: cargo llvm-cov --workspace --all-features --html
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: target/llvm-cov/html
